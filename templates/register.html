<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join IGDTUW Campus Canteen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f7fd;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .sc-register-container {
            width: 100%;
            max-width: 1000px;
            min-height: 620px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(30, 70, 120, 0.10);
        }

        /* Branding Section */

        .sc-register-brand {
            background: linear-gradient(145deg, #173b70, #2879d8);
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sc-campus-tag {
            display: inline-block;
            width: fit-content;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sc-register-brand h1 {
            font-size: 36px;
            line-height: 1.25;
            margin: 25px 0 15px;
        }

        .sc-brand-tagline {
            font-size: 16px;
            color: #e2edff;
            line-height: 1.6;
        }

        .sc-food-illustration {
            font-size: 43px;
            margin: 25px 0;
            letter-spacing: 5px;
        }

        .sc-brand-description {
            color: #e2edff;
            line-height: 1.7;
            font-size: 14px;
        }

        .sc-canteen-name {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            font-weight: bold;
            font-size: 14px;
        }

        /* Registration Form */

        .sc-register-form-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sc-back-home {
            color: #2879d8;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .sc-back-home:hover {
            color: #173b70;
        }

        .sc-form-heading h2 {
            color: #173b70;
            font-size: 28px;
            margin: 0 0 8px;
        }

        .sc-form-heading p {
            color: #78879a;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .sc-register-form label {
            display: block;
            color: #34445a;
            font-size: 13px;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        .sc-register-form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dce5f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .sc-register-form input:focus {
            border-color: #2879d8;
            box-shadow: 0 0 0 3px rgba(40, 121, 216, 0.10);
        }

        .sc-register-form button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2879d8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .sc-register-form button:hover {
            background: #173b70;
            transform: translateY(-2px);
        }

        .sc-form-footer {
            text-align: center;
            color: #8794a5;
            font-size: 13px;
            margin-top: 25px;
        }

        /* Responsive */

        @media (max-width: 750px) {
            .sc-register-container {
                grid-template-columns: 1fr;
            }

            .sc-register-brand {
                padding: 35px 30px;
            }

            .sc-register-brand h1 {
                font-size: 29px;
            }

            .sc-food-illustration {
                font-size: 32px;
                margin: 15px 0;
            }

            .sc-register-form-section {
                padding: 35px 25px;
            }
        }
    </style>

</head>

<body>

    <div class="sc-register-container">

        <!-- Left Branding Section -->

        <div class="sc-register-brand">

            <span class="sc-campus-tag">IGDTUW CAMPUS LIFE</span>

            <h1>IGDTUW's<br>Campus Canteen</h1>

            <p class="sc-brand-tagline">
                Your Campus. Your Cravings. Your Canteen.
            </p>

            <div class="sc-food-illustration">
                🍔 🍟 🥪 ☕
            </div>

            <p class="sc-brand-description">
                Good food, great friends and unforgettable campus moments.
            </p>

            <p class="sc-canteen-name">
                Featuring Tiwari Uncle's Canteen
            </p>

        </div>


        <!-- Right Registration Form -->

        <div class="sc-register-form-section">

            <a href="/" class="sc-back-home">← Back to Home</a>

            <div class="sc-form-heading">
                <h2>Create Account</h2>
                <p>Join the campus food community!</p>
            </div>

            <form action="/register" method="POST"
                  class="sc-register-form">

                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>

                <label>College ID</label>
                <input type="text" name="college_id"
                       placeholder="Enter your college ID" required>

                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password"
                       placeholder="Confirm your password" required>

                <button type="submit">
                    Create My Account →
                </button>

            </form>

            <p class="sc-form-footer">
                Made for IGDTUW students ❤️
            </p>

        </div>

    </div>

</body>
</html>
